[writer]
user = www-data
group = www-data
listen = 127.0.0.1:9101
pm = static
pm.max_children = 1
php_admin_flag[session.upload_progress.enabled] = on
php_admin_value[session.serialize_handler] = php
php_admin_value[session.save_path] = /var/lib/php/pra-shared-sessions

[reader]
user = www-data
group = www-data
listen = 127.0.0.1:9102
pm = static
pm.max_children = 1
php_admin_value[session.serialize_handler] = php_serialize
php_admin_value[session.save_path] = /var/lib/php/pra-shared-sessions

