name: Adopt agent-loop recovery (guarded)
on:
  pull_request:
    paths:
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/consumer-recovery.yml'
      - 'tools/consumer-recovery/**'

permissions:
  contents: write

concurrency:
  group: recovery-adoption-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  locked-recovery:
    # This is an explicit, one-branch consumer migration. Never grant write
    # tokens to code supplied by a fork, and never modify the base branch.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dependency/agent-loop-recovery-0.20.70'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Resolve published recovery release into lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          composer update voku/agent-loop --with-all-dependencies --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
          composer validate --strict --no-check-publish
          php tools/consumer-recovery/check-lock.php composer.lock
          git diff --check
      - name: Prove installed recovery command exists
        shell: bash
        run: |
          set -Eeuo pipefail
          composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
          vendor/bin/agent-loop pipeline recover --help
          vendor/bin/agent-loop init doctor
      - name: Commit generated lock only to the preapproved research branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "dependency/agent-loop-recovery-0.20.70"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          if git diff --quiet -- composer.lock; then
            echo "Lockfile already current; no commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- composer.lock
          git diff --cached --check
          git commit -m "chore(deps): resolve agent-loop 0.20.70 recovery release"
          git push origin HEAD:refs/heads/dependency/agent-loop-recovery-0.20.70
