# Temporary, branch-restricted repair runner. It removes itself from the generated commit.
# No merges, releases, or host changes are authorized by this workflow.
name: PRA-4 one-shot managed projection repair

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'composer.json'
      - '.github/workflows/pra4-pr32-resync.yml'

permissions:
  contents: read

concurrency:
  group: pra4-pr32-managed-projection
  cancel-in-progress: false

jobs:
  regenerate:
    if: >-
      github.event.pull_request.number == 32 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/pra4-main-sync-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Verify target branch has not moved
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/integration/pra4-main-sync-20261109 | cut -f1)" = "$EXPECTED_HEAD"
      - name: Update locked upstream owner and regenerate managed Codex skills
        shell: bash
        env:
          COMPOSER_NO_INTERACTION: '1'
          COMPOSER_ALLOW_SUPERUSER: '0'
        run: |
          set -euo pipefail
          composer update 'voku/agent-loop:0.20.89' --with-all-dependencies --minimal-changes --no-interaction --no-progress
          composer validate --no-check-publish
          vendor/bin/agent-loop init scaffold --prefix=PRA --agent=codex
          vendor/bin/agent-loop init sync-policy --agent=codex
          vendor/bin/agent-loop init install-assets --agent=codex
          vendor/bin/agent-loop init validate --kind=skills --agent=codex
          php -r '$lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR); $packages = array_merge($lock["packages"], $lock["packages-dev"]); $version = null; foreach ($packages as $package) { if ($package["name"] === "voku/agent-loop") { $version = $package["version"]; break; } } if ($version !== "0.20.89") { fwrite(STDERR, "Unexpected agent-loop version: " . var_export($version, true) . "\n"); exit(1); }'
          grep -Fq '| PHPStan Repair Context | Repository PHPStan command' .codex/skills/agent-loop-l2-context/SKILL.md
          grep -Fq "Use the repository's PHPStan command" .codex/skills/agent-loop-l2-context/SKILL.md
          git diff --check
          git status --short
      - name: Commit only regenerated owner projections and dependency lock
        shell: bash
        env:
          TARGET_BRANCH: integration/pra4-main-sync-20261109
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Fail if dependency tooling rewrote application code or non-managed workflows.
          if ! git diff --quiet -- src bin tests resources .github README.md docs composer.json; then
            echo "Unexpected production or workflow changes: refusing to commit." >&2
            exit 1
          fi
          git add -A -- composer.lock .codex AGENTS.md .agent-loop
          git rm -- .github/workflows/pra4-pr32-resync.yml
          git diff --cached --check
          git diff --cached --stat
          if test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" != "$EXPECTED_HEAD"; then
            echo "PR head moved during generation: refusing stale write." >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(pra4): regenerate pinned agent-loop managed projections'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Dispatch exact-head smoke and host proof workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=integration/pra4-main-sync-20261109
          gh workflow run bootstrap.yml --ref "$branch"
          gh workflow run build-phar.yml --ref "$branch"
          gh workflow run bounded-dpkg-real-host.yml --ref "$branch"
