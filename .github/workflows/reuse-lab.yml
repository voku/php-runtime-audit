name: Reuse lab (pinned upstream)
on:
  pull_request:
    paths:
      - '.github/workflows/reuse-lab.yml'
      - 'tools/reuse-lab/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reuse-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned-upstream-tests:
    name: Evaluate ${{ matrix.candidate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - cloudflare
          - php2shell-doctor
          - p2selfcheck
          - bashclub
    steps:
      - name: Checkout consumer (without persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify static lab configuration
        run: python3 tools/reuse-lab/check_manifest.py
      - name: Fetch pinned source and run isolated tests
        id: evaluate
        shell: bash
        run: bash tools/reuse-lab/evaluate.sh "${{ matrix.candidate }}"
      - name: Preserve provenance, results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reuse-lab-${{ matrix.candidate }}-${{ github.run_id }}
          path: reuse-lab-results/${{ matrix.candidate }}/
          retention-days: 14
          if-no-files-found: warn
