# One-time merge and canonical projection repair. This workflow removes itself.
# Mainline merge only into PR #32; never merge PR #32 or #13 into their base.
name: PRA-4 one-shot current-main reconciliation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/pra4-pr32-sync-main.yml'

permissions:
  contents: read

concurrency:
  group: pra4-pr32-main-sync
  cancel-in-progress: false

jobs:
  integrate-main:
    if: >-
      github.event.pull_request.number == 32 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/pra4-main-sync-20261109'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Exact branch checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Configure PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Verify and merge reviewed mainline
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MAIN: 5bf93e1582672cc47f04cf1f3edba3f907532f17
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/integration/pra4-main-sync-20261109 | cut -f1)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          if ! git merge --no-ff --no-commit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            (("${#conflicts[@]}" > 0)) || exit 1
            # These are generated projections. Keep local candidates until
            # the owner CLI regenerates them from the merged canonical sources.
            for file in "${conflicts[@]}"; do
              case "$file" in
                .codex/skills/.agent-loop-manifest.json|.codex/skills/php-runtime-audit/SKILL.md)
                  git checkout --ours -- "$file"
                  git add -- "$file"
                  ;;
                *)
                  echo "Unexpected semantic conflict in $file; merge aborted." >&2
                  exit 1
                  ;;
              esac
            done
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Regenerate official managed projections and verify PHP
        env:
          COMPOSER_NO_INTERACTION: '1'
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/agent-loop init scaffold --prefix=PRA --agent=codex
          vendor/bin/agent-loop init sync-policy --agent=codex
          vendor/bin/agent-loop init install-assets --agent=codex
          vendor/bin/agent-loop init validate --kind=skills --agent=codex
          grep -Fq '| PHPStan Repair Context | Repository PHPStan command' .codex/skills/agent-loop-l2-context/SKILL.md
          git diff --exit-code origin/main -- resources/skills/php-runtime-audit/SKILL.md
          composer test
          composer analyse
          composer format-check
          git diff --check
          git status --short
      - name: Commit exact reconciled merge without any release
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: integration/pra4-main-sync-20261109
        run: |
          set -euo pipefail
          git add -A -- .codex .agent-loop AGENTS.md composer.lock
          git rm -- .github/workflows/pra4-pr32-sync-main.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git diff --cached --stat
          if test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" != "$EXPECTED_HEAD"; then
            echo "Branch changed during merge validation; refusing stale push." >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'merge(pra4): reconcile current main and regenerate managed projections'
          git log -1 --format='%H parents=%P'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
