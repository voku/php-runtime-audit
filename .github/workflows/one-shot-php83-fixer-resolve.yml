name: One-shot PHP 8.3 compatible fixer lock
on:
  push:
    branches:
      - ci/fixer-php83-lock-20261109
    paths:
      - '.github/workflows/one-shot-php83-fixer-resolve.yml'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/fixer-php83-lock-20261109
          persist-credentials: true
      - name: Verify exact event commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Resolve exact requested fixer version on minimum DEV PHP version
        shell: bash
        run: |
          set -euo pipefail
          composer update 'friendsofphp/php-cs-fixer:3.95.28' --with-all-dependencies --minimal-changes --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
            $packages = array_column($lock["packages-dev"], null, "name");
            if (($packages["friendsofphp/php-cs-fixer"]["version"] ?? null) !== "v3.95.28") {
                throw new RuntimeException("Requested fixer version missing");
            }
            foreach ($packages as $name => $package) {
                if (str_starts_with($name, "symfony/") && str_starts_with($package["version"], "v8.")) {
                    throw new RuntimeException("PHP 8.3 cannot install Symfony 8: " . $name);
                }
            }
          '
          composer validate --no-check-publish
      - name: Run actual PHP quality and security tests
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          composer test
          composer analyse
          composer format-check
      - name: Commit only resolved composer.lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'composer.lock'
          git add -- composer.lock
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): resolve php-cs-fixer 3.95.28 with PHP 8.3 compatible Symfony'
          git push origin HEAD:refs/heads/ci/fixer-php83-lock-20261109
