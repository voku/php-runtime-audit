name: PR35 isolated projection regeneration

on:
  push:
    branches:
      - 'automation/pr35-projection-fix'
    paths:
      - '.github/workflows/pr35-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v7
        with:
          ref: automation/pr35-projection-fix
          fetch-depth: 2
      - name: Verify exact PR35 starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '14888d1d368807ed9588400b15a0aa7036f02c3c'
          test "$(git branch --show-current)" = 'automation/pr35-projection-fix'
      - name: Set up PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Validate and install locked dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
      - name: Regenerate canonical project-owned Codex assets
        run: |
          vendor/bin/agent-loop init scaffold --prefix=PRA --agent=codex
          vendor/bin/agent-loop init doctor
          vendor/bin/agent-loop init sync-policy --agent=codex
          vendor/bin/agent-loop init install-assets --agent=codex
          vendor/bin/agent-loop init validate --kind=skills --agent=codex
          vendor/bin/agent-loop init host-status --agent=codex --format=json
      - name: Validate PHP consumer
        run: |
          composer test
          composer analyse
          composer format-check
      - name: Stage only generated project assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- composer.lock
          git add -A -- AGENTS.md .agent-loop .codex
          git diff --cached --check
          echo '--- staged projection changes ---'
          git diff --cached --stat
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo 'No projection change produced; refusing empty repair.' >&2
            exit 1
          fi
          git rm -- .github/workflows/pr35-regenerate.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: regenerate agent-loop 0.20.88 Codex projection'
          echo '--- committed tree ---'
          git show --stat --oneline HEAD
      - name: Push generated commit only to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/automation/pr35-projection-fix
